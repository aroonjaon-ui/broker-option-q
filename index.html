<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xena Broker — Stock Trading & Portfolio Management</title>
    <meta name="description" content="Xena Broker is a professional stock trading, order execution, and portfolio management platform." />
    <meta property="og:title" content="Xena Broker — Stock Trading & Portfolio Management" />
    <meta property="og:description" content="Professional stock trading, real-time portfolio analytics, and order execution." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; background: #F8FAFC; }
      #startup-error {
        display: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.6;
        color: #fecdd3;
        background: #0f172a;
        padding: 20px;
        margin: 24px auto;
        max-width: 900px;
        border-radius: 10px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #startup-error b { color: #fff; font-family: system-ui, sans-serif; font-size: 14px; }
    </style>
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] antialiased selection:bg-blue-100 selection:text-blue-900">
    <div id="root"></div>

    <!-- Surfaces startup/JS errors instead of showing a blank white page -->
    <script>
      (function () {
        function report(title, detail) {
          try {
            var root = document.getElementById('root');
            // Only take over the screen when the app genuinely rendered nothing.
            // A caught error inside a working page must not wipe a healthy UI.
            if (root && root.childElementCount > 0) {
              console.error(title, detail);
              return;
            }
            var pre = document.getElementById('startup-error');
            if (!pre) {
              pre = document.createElement('pre');
              pre.id = 'startup-error';
              document.body.appendChild(pre);
            }
            pre.style.display = 'block';
            pre.innerHTML =
              '<b>' + title + '</b>\n\n' + String(detail || 'Unknown error').replace(/</g, '&lt;');
          } catch (e) {}
        }

        window.addEventListener(
          'error',
          function (event) {
            var target = event && event.target;
            // A failed <script>/<link>/<img> load only reaches window in capture phase.
            if (target && target !== window && target.tagName) {
              report(
                'Xena Broker could not load a required file',
                target.tagName + ' failed to load:\n' + (target.src || target.href || 'unknown URL') +
                  '\n\nThis is usually a stale cached page. Hard refresh with Ctrl + Shift + R.'
              );
              return;
            }
            if (event && (event.message || event.error)) {
              report(
                'Xena Broker failed to start',
                (event.error && event.error.stack) || event.message
              );
            }
          },
          true
        );

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          report('Xena Broker hit an unhandled error', (reason && reason.stack) || reason);
        });

        // Watchdog: if nothing rendered and no error fired, say so instead of showing white.
        window.setTimeout(function () {
          try {
            var root = document.getElementById('root');
            if (root && root.childElementCount === 0 && !document.getElementById('startup-error')) {
              report(
                'Xena Broker did not finish loading',
                'Nothing has rendered after 8 seconds.\n\n' +
                  'Page: ' + window.location.href + '\n\n' +
                  'This usually means the deployed build is failing or a script asset could not be loaded.\n' +
                  'Try a hard refresh (Ctrl + Shift + R).'
              );
            }
          } catch (e) {}
        }, 8000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
